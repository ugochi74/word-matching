<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play WordMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/game.js') }}" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="{{ url_for('home') }}">Word<span>Match</span></a><a class="text-link" href="{{ url_for('home') }}">← Home</a></header>
    <main class="game-page page-width">
        <div class="game-heading"><p class="eyebrow">YOUR ROUND</p><h1>Find the right meaning.</h1><p class="intro">Choose one definition for every word. You can change your choices before submitting.</p></div>
        <form method="post" action="{{ url_for('game') }}" class="matching-form">
            <div class="match-header"><span>WORD</span><span>CHOOSE A DEFINITION</span></div>
            {% for word in words %}
            <div class="match-row">
                <label class="word-label" for="{{ word.id }}"><span class="word-index">{{ '%02d' % loop.index }}</span><span>{{ word.word }}</span></label>
                <select id="{{ word.id }}" name="{{ word.id }}" required>
                    <option value="">Select a meaning…</option>
                    {% for definition in definitions %}<option value="{{ definition.id }}">{{ definition.definition }}</option>{% endfor %}
                </select>
            </div>
            {% endfor %}
            <div class="form-bottom"><p id="answer-count" class="quiet-note">0 of {{ words|length }} answered</p><button class="button button-primary" type="submit">Check my answers →</button></div>
        </form>
    </main>
    <footer class="site-footer page-width"><span>WordMatch</span><span>Take your time. You’ve got this.</span></footer>
</body>
</html>
